name: Tests et déploiement

on:
  push:
  pull_request:
  workflow_dispatch:
  # Le dépôt vient de passer de privé à public : on publie le site.
  public:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
        with:
          path: dist

  # Publie l'appli sur GitHub Pages à chaque mise à jour de main.
  # GitHub Pages est gratuit pour les dépôts publics : tant que le dépôt est privé, cette étape est sautée.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Juste après le passage en public, on laisse le temps de choisir
      # Settings → Pages → Source : « GitHub Actions » (20 minutes au plus).
      - name: Attendre l'activation de GitHub Pages
        if: github.event_name == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
              exit 0
            fi
            echo "GitHub Pages pas encore activé avec la source « GitHub Actions »… ($attempt/60)"
            sleep 20
          done
          echo "::error::Active GitHub Pages : Settings → Pages → Source : GitHub Actions, puis relance ce workflow."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
